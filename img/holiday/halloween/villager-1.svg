<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28">
  <!-- WHY: Flat fleeing peasant for CITY_HALLOWEEN chase. Faces left like the
       horseman PNG so the chase group's scaleX flip keeps them ahead. Forward
       lean + stride sell "running" at ~18px better than a standing figure. -->
  <!-- trailing arm -->
  <path fill="#C4A574" d="M18 11c2.2-.2 4.2 1.2 5.2 2.6l-1.3.8c-.8-1.1-2.2-2-3.4-1.8z"/>
  <!-- leading arm -->
  <path fill="#C4A574" d="M8.5 12.2c-2.4.4-4.2 2-5.2 3.2l1.2.9c.8-.9 2.2-2.2 3.8-2.5z"/>
  <!-- torso lean — red shirt -->
  <path fill="#B22222" d="M10.2 8.5c2.2-1.2 6.2-.4 7.4 1.2 1.2 1.6 1.6 4.8.6 6.6H9.4c-.8-1.6-.4-5.4.8-7.8z"/>
  <!-- head -->
  <ellipse cx="11.2" cy="5" rx="3.3" ry="3.5" fill="#C4A574"/>
  <!-- hair -->
  <path fill="#5C3D2E" d="M7.6 3.2c1.2-2 4.6-2.4 6.8-.4.5.4.3 1.1-.4 1.2-1.8.3-3.6.4-5.4.1-.7-.1-1-.6-.6-.9z"/>
  <circle cx="9.8" cy="4.8" r=".55" fill="#2A2A2A"/>
  <!-- trailing leg -->
  <path fill="#3D2B1F" d="M14.2 16.2l3.2-.4 3.8 7.2c.3.6-.1 1.2-.8 1.3l-1.5.1c-.5 0-.9-.4-1.1-.9l-3.6-7.3z"/>
  <!-- leading leg -->
  <path fill="#3D2B1F" d="M10.4 16.4l-2.8 1.2-4.6 6.2c-.4.5-1.1.5-1.5.1l-1-.9c-.4-.4-.3-1 .2-1.3l9.7-5.3z"/>
</svg>
